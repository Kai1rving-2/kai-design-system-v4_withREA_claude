<!-- @dsCard group="Components" viewport="700x690" name="Core · Button 与 Link" subtitle="10px 圆角 · 语义图标 · 状态合同" -->
<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Core</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { padding: 24px 32px; }
  .cap { font-family: var(--font-ui); font-size: var(--text-caption); color: var(--text-3); margin: 22px 0 10px; }
  .cap:first-child { margin-top: 0; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const ds = window.KaiDesignSystemV4_3b9cf5;

function Demo() {
  return (
    <div>
      <div className="cap">Button · primary 是 graphite——KAI 没有 Primary Color</div>
      <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
        <ds.Button leadingIcon={<ds.Icon name="check" size={16} />}>保存草稿</ds.Button>
        <ds.Button variant="secondary" trailingIcon={<ds.Icon name="arrowRight" size={16} />}>浏览项目</ds.Button>
        <ds.Button className="is-pending">正在保存……</ds.Button>
        <ds.Button disabled>不可用</ds.Button>
      </div>
      <p style={{ fontSize: 'var(--text-caption)', color: 'var(--text-3)', marginTop: 10 }}>
        10px 操作圆角，图标只辅助文字。pressed：primary 加深一档、secondary 落 border-1；pending 停一切交互。</p>

      <div className="cap">IconButton · 悬停与键盘聚焦都显示文字提示</div>
      <div style={{ display: 'flex', gap: 10, alignItems: 'center' }}>
        <ds.IconButton aria-label="搜索"><ds.Icon name="search" /></ds.IconButton>
        <ds.IconButton aria-label="刷新结果"><ds.Icon name="refresh" /></ds.IconButton>
        <ds.IconButton aria-label="更多操作"><ds.Icon name="more" /></ds.IconButton>
        <span style={{ fontSize: 'var(--text-caption)', color: 'var(--text-3)' }}>18px 轻线条 · 44px 点击区域 · 试着悬停或按 Tab</span>
      </div>

      <div className="cap">Link · 用字重、方向符号和圆角浅底表达跳转</div>
      <p style={{ fontSize: 'var(--text-body)', marginBottom: 14 }}>
        详见 <ds.TextLink href="#">期限结构笔记</ds.TextLink>，或
        <ds.TextLink href="https://example.com" external>外部网站</ds.TextLink>。
      </p>
      <div style={{ display: 'flex', gap: 8, alignItems: 'center', marginBottom: 14 }}>
        <ds.NavLink href="#" active>索引</ds.NavLink>
        <ds.NavLink href="#">项目</ds.NavLink>
        <ds.NavLink href="#">笔记</ds.NavLink>
      </div>
      <ds.BackLink href="#">返回那天</ds.BackLink>
      <p style={{ fontSize: 'var(--text-caption)', color: 'var(--text-3)', marginTop: 10 }}>
        行内链接不加下划线；→ / ↗ 区分站内与外部跳转；导航用圆角浅底标记当前页。按 Tab 可查看焦点。</p>

      <div className="cap">状态合同（所有交互组件）</div>
      <p style={{ fontSize: 'var(--text-label)', color: 'var(--text-2)', lineHeight: 1.7 }}>
        default / hover / pressed / focus-visible / disabled / pending；可选择的组件加 selected；表单加 error / success。</p>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
