<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Tasks</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body { padding: 32px; }</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const ds = window.KaiDesignSystemV4_3b9cf5;
function Demo() {
  const [items, setItems] = React.useState([
    { text: '读完期限结构那章', done: true },
    { text: '给妈妈打电话', done: false },
    { text: '跑一次 XGBoost 基线', done: false },
  ]);
  const done = items.filter((t) => t.done).length;
  const toggle = (i) => setItems(items.map((t, j) => (j === i ? { ...t, done: !t.done } : t)));
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
      <div className="kai-task-list">
        {items.map((t, i) => (
          <ds.TaskItem key={i} text={t.text} done={t.done}
            onToggle={() => toggle(i)}
            onDelete={() => setItems(items.filter((_, j) => j !== i))} />
        ))}
      </div>
      <ds.ProgressLine value={items.length ? done / items.length * 100 : 0}
        label={done === items.length ? '今天做完了。' : '完成了 ' + done + ' / ' + items.length} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
