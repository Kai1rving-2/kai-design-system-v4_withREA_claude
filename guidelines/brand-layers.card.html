<!-- @dsCard group="Brand" viewport="700x300" name="两层结构" subtitle="Quiet Base 90% · Signature 10%" -->
<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 20px 24px; }
  .lbl { font-family: var(--font-ui); font-size: var(--text-caption); color: var(--text-3); }
  .row { display: flex; gap: 4px; }
</style>
</head>
<body>
<div style="display:grid;grid-template-columns:3fr 1fr;gap:12px;">
  <div style="border:1px solid var(--border-1);background:var(--surface);padding:20px;">
    <p class="lbl" style="margin-bottom:8px;">QUIET BASE · 90%</p>
    <p style="font-size:var(--text-body-sm);color:var(--text-2);line-height:1.6;">
      背景、文字、按钮、输入框、列表、导航、表格、表单。<br />
      尽可能没有性格。极其稳定、清楚、自然。<br />
      判断标准不是「它应该怎么更 KAI」，而是——</p>
    <p style="font-size:var(--text-body);color:var(--text-1);margin-top:8px;">这里真的需要 KAI 出声吗？</p>
  </div>
  <div style="border:1px solid var(--deep);background:var(--deep);padding:20px;display:flex;flex-direction:column;justify-content:flex-end;">
    <p class="lbl" style="color:rgba(232,240,239,.55);margin-bottom:8px;">SIGNATURE · 10%</p>
    <p style="font-family:var(--font-serif);font-style:italic;font-weight:var(--weight-display);font-size:var(--text-heading);line-height:1.6;color:#d8e6e4;">
      Serif。<br />一句诗。<br />一点 steel blue。</p>
  </div>
</div>
<p class="lbl" style="margin-top:10px;">第一眼没意识到它设计了很多东西——这就是高级感的来源。只要答案不是明确的「需要」，就不加。</p>
</body>
</html>
