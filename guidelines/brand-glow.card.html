<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 20px 24px; }
  .lbl { font-family: var(--font-ui); font-size: var(--text-caption); color: var(--text-3); }
  .row { display: flex; gap: 4px; }
</style>
</head>
<body>
<div style="position:relative;height:120px;background:var(--page);border:1px solid var(--border-1);overflow:hidden;">
  <div style="position:absolute;top:-30%;right:-10%;width:60%;height:150%;background:radial-gradient(ellipse at 65% 25%, rgba(201,168,76,0.14) 0%, rgba(49,90,117,0.07) 45%, transparent 70%);transform:rotate(-10deg);"></div>
  <span class="lbl" style="position:absolute;bottom:8px;left:10px;">给 body 加 class="kai-moment" 点亮。工具页不点灯。</span>
</div>
<p class="lbl" style="margin-top:10px;">斜光不再是一个 CSS 效果，而是一个问题：这一页是不是在替你说话？不是，就别点。它可以是一句文案、一点 blue、一段留白——甚至什么都没有。</p>
</body>
