<!-- @dsCard group="Spacing" viewport="700x240" name="间距标尺" subtitle="4px 基数 · 12 档" -->
<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 20px 24px; }
  .lbl { font-family: var(--font-ui); font-size: var(--text-caption); color: var(--text-3); }
</style>
</head>
<body>
<div style="display:flex;flex-direction:column;gap:7px;">
  <div style="display:flex;align-items:center;gap:12px"><span class="lbl" style="width:86px">space-1 · 4</span><div style="height:3px;width:4px;background:var(--accent);"></div></div>
  <div style="display:flex;align-items:center;gap:12px"><span class="lbl" style="width:86px">space-4 · 16</span><div style="height:3px;width:16px;background:var(--accent);"></div></div>
  <div style="display:flex;align-items:center;gap:12px"><span class="lbl" style="width:86px">space-6 · 24</span><div style="height:3px;width:24px;background:var(--accent);"></div></div>
  <div style="display:flex;align-items:center;gap:12px"><span class="lbl" style="width:86px">space-10 · 40</span><div style="height:3px;width:40px;background:var(--accent);"></div></div>
  <div style="display:flex;align-items:center;gap:12px"><span class="lbl" style="width:86px">space-16 · 64</span><div style="height:3px;width:64px;background:var(--accent);"></div></div>
  <div style="display:flex;align-items:center;gap:12px"><span class="lbl" style="width:86px">space-24 · 96</span><div style="height:3px;width:96px;background:var(--accent);"></div></div>
</div>
<p class="lbl" style="margin-top:10px;">任何间距都是 4 的倍数。骨架笃定，装饰才有资格缺席。</p>
</body>
</html>
