<!-- @dsCard group="Colors" viewport="700x210" name="Quiet Base 中性色" subtitle="低噪音层级 · 必要次级文字对比度至少 4.5" -->
<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 20px 24px; }
  .lbl { font-family: var(--font-ui); font-size: var(--text-caption); color: var(--text-3); }
  .row { display: flex; gap: 4px; }
</style>
</head>
<body>
<div style="display:flex;gap:8px;height:52px;">
  <div style="flex:1;background:var(--page);border:1px solid var(--border-1);display:flex;align-items:flex-end;padding:6px"><span class="lbl">page #F7F7F5</span></div>
  <div style="flex:1;background:var(--surface);border:1px solid var(--border-1);display:flex;align-items:flex-end;padding:6px"><span class="lbl">surface #FFFFFF</span></div>
  <div style="flex:1;background:var(--sunken);border:1px solid var(--border-1);display:flex;align-items:flex-end;padding:6px"><span class="lbl">sunken</span></div>
  <div style="flex:1;background:var(--border-1);display:flex;align-items:flex-end;padding:6px"><span class="lbl">border-1</span></div>
  <div style="flex:1;background:var(--border-2);display:flex;align-items:flex-end;padding:6px"><span class="lbl">border-2</span></div>
</div>
<p class="lbl" style="margin-top:10px;">纯白被平反：Surface 用白、Page 用极轻暖灰——层级自然，页面不再时刻带着「暖色意识」。文字全部中性：#1F2124 / #5F646B / #6B7077。</p>
</body>
</html>
