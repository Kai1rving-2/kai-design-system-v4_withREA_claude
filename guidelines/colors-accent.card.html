<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 20px 24px; }
  .lbl { font-family: var(--font-ui); font-size: var(--text-caption); color: var(--text-3); }
  .row { display: flex; gap: 4px; }
</style>

<body>
<div style="display:flex;gap:8px;height:44px;">
  <div style="flex:2;background:var(--accent);display:flex;align-items:center;justify-content:center"><span class="lbl" style="color:#fff">accent #315a75</span></div>
  <div style="flex:1;background:var(--accent-deep);display:flex;align-items:center;justify-content:center"><span class="lbl" style="color:#fff">deep #294B61</span></div>

</div>
<p class="lbl" style="margin-top:10px;">一个 token 三用：白字底 7.4:1 / 作文字（白底）7.4:1/ 选中与焦点。比 teal 更有骨架感：灰里带蓝、蓝里带冷——不是体育品牌的鲜蓝，是独行侠的钢蓝。</p>
