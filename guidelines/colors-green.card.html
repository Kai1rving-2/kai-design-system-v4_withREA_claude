<!-- @dsCard group="Colors" viewport="700x190" name="Green 绿色是呼吸" subtitle="完成 · 恢复 · 自然 · 让界面松下来" -->
<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 20px 24px; }
  .lbl { font-family: var(--font-ui); font-size: var(--text-caption); color: var(--text-3); }
</style>
</head>
<body>
<div style="display:flex;gap:8px;height:44px;">
  <div style="flex:2;background:var(--fresh);display:flex;align-items:center;justify-content:center"><span class="lbl" style="color:#fff">fresh #4F806B</span></div>
  <div style="flex:1;background:var(--fresh-deep);display:flex;align-items:center;justify-content:center"><span class="lbl" style="color:#fff">deep #3F6753</span></div>
  <div style="flex:1;background:var(--fresh-wash);border:1px solid var(--border-1);display:flex;align-items:center;justify-content:center"><span class="lbl" style="color:var(--fresh-deep)">wash</span></div>
</div>
<p class="lbl" style="margin-top:10px;">绿色不再是品牌主色，是 freshness accent：完成态（勾选、进度）、恢复、成功、自然场景。它不表达身份，只让界面松下来——所以它很珍贵。</p>
<p class="lbl" style="margin-top:6px;">判断：这里需要表达 KAI 的身份吗？→ blue。这里需要松一点、自然一点吗？→ 才用 green。</p>
</body>
</html>
